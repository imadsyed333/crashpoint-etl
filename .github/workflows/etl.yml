name: etl

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
