services:
  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow
    restart: always
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas geopandas rapidfuzz shapely pyproj sqlalchemy geoalchemy2 psycopg2-binary
      - AIRFLOW_USERNAME=${AIRFLOW_USERNAME}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD}
      - PYTHONPATH=/opt/airflow
      - DATABASE_URL=postgresql://crashpoint:crashpoint@postgis:5432/crashpoint
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
    ports:
      - "8080:8080"
    depends_on:
      - postgis
    # ponytail: Docker creates this bind mount as nobody:0755, so chmod 777 is what
    # actually lets AIRFLOW_UID write. Upgrade path: chown ${AIRFLOW_UID}:0 and 2775
    # once the engine shares this distro's user namespace.
    user: "0:0"
    entrypoint: ["/usr/bin/dumb-init", "--", "bash", "-c"]
    command:
      - |
        mkdir -p /opt/airflow/data/raw /opt/airflow/data/processed
        chmod 777 /opt/airflow/data /opt/airflow/data/raw /opt/airflow/data/processed
        exec gosu "${AIRFLOW_UID:-50000}:0" /entrypoint bash /opt/airflow/scripts/init_airflow.sh

  postgis:
    image: postgis/postgis:16-3.5
    container_name: postgis
    restart: always
    environment:
      - POSTGRES_USER=crashpoint
      - POSTGRES_PASSWORD=crashpoint
      - POSTGRES_DB=crashpoint
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
